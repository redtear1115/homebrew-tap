# Builds the arm64_sequoia bottle, then proves it pours on runners that can't build it.
# Adapted from the workflow `brew tap-new` generates (Homebrew 7.0.4); see the PR for what changed.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    # One bottle, built on the oldest macOS the formula supports. Homebrew pours a bottle built
    # for an older macOS on newer ones, not the reverse, so arm64_sequoia should cover 15 and 26
    # on Apple Silicon. pour-check measures that on macos-26 rather than trusting it.
    runs-on: macos-15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      formula_changed: ${{ steps.formula-changed.outputs.changed }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-15-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-15-rubygems-

      # The macos-15 image installs Xcode 26.x but selects 16.4, and the formula needs Swift 6.2.
      # Select 26 for the build only, and print what built the bottle so the log says so.
      - name: Select Xcode 26 to build the bottle
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcode-select -p
          swift --version

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # pour-check needs to know whether it has anything to check. Key this on the PR's changed
      # files, not on whether a bottle got built below — a formula change that fails to produce a
      # bottle must still fail pour-check loudly, not skip it.
      # gh isn't installed on this runner image, and even where it is, piping its output into
      # `grep -q` under `pipefail` is a race: grep can exit as soon as it finds a match, sending gh
      # a SIGPIPE that pipefail then reports as the pipeline having failed. So this fetches the
      # PR's files with curl and writes them to a plain file, and greps the file, not a pipe. It
      # also isn't wrapped in an `if` — a curl or parse failure has to fail the step outright, not
      # get swallowed and read as "no formula changed".
      - name: Check whether this PR changes a formula
        id: formula-changed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files_list="$RUNNER_TEMP/pr-files.txt"
          : > "$files_list"
          page=1
          while true; do
            response="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            count="$(ruby -rjson -e '
              path = ARGV[0]
              data = JSON.parse(STDIN.read)
              File.open(path, "a") { |f| data.each { |entry| f.puts entry.fetch("filename") } }
              puts data.length
            ' "$files_list" <<<"$response")"
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "PR #$PR_NUMBER changed files:"
          cat "$files_list"
          if grep -q '^Formula/' "$files_list"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: A formula changed but --only-formulae produced no bottle
        if: github.event_name == 'pull_request' && steps.formula-changed.outputs.changed == 'true'
        run: |
          if ! ls -- *.bottle.* >/dev/null 2>&1; then
            echo "Formula/ changed but --only-formulae produced no bottle; pour-check would have nothing to check." >&2
            exit 1
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_macos-15
          path: '*.bottle.*'

  pour-check:
    # Pours the bottle test-bot just built, on runners that never select Xcode 26.
    # macos-15: its default Xcode is 16.4, so it cannot build the formula and a successful install
    #   can only be a pour. assert-xcode-not-26.sh fails loudly if the image ever changes that.
    # macos-26: the measurement that one arm64_sequoia bottle also runs on 26. If it doesn't pour
    #   there, we add a second bottle rather than argue. This installs the bottle *file*, so it
    #   proves the binary runs on 26; that brew *selects* this bottle on 26 from the release is
    #   release-pour-check's job, after publishing.
    #
    # Skipped when the PR changes no formula: test-bot then builds no bottle, and there's nothing
    # for this job to pour. Gated on the PR's changed files (test-bot's formula_changed output),
    # not on whether a bottle exists — a formula change that fails to produce one still fails
    # test-bot's own check above, loudly, instead of quietly skipping this job.
    needs: test-bot
    if: github.event_name == 'pull_request' && needs.test-bot.outputs.formula_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config for the steps below.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottles_macos-15
          path: bottles

      - name: Show the runner, and that nothing selected Xcode 26
        run: |
          sw_vers
          xcode-select -p
          ls -l bottles

      - name: This runner must not be able to build the formula
        if: matrix.os == 'macos-15'
        run: .github/scripts/assert-xcode-not-26.sh

      - name: Tap this checkout
        run: |
          git switch -c pour-check
          brew tap redtear1115/tap "$GITHUB_WORKSPACE"

      # This Homebrew won't install a bottle file from a path: given a relative one it looked for a
      # formula of that name, and given an absolute one it read `/users/…` as a tap. So do what a
      # published release does and put the bottle in the formula's `bottle do` block. Two things
      # differ from production, and only these: root_url is a file:// directory instead of the
      # GitHub release, and the file is served under the name brew asks for (`marsdawn-…`, one
      # dash) rather than the name test-bot wrote it under (`marsdawn--…`, two). Rewriting the
      # JSON's root_url is deliberate: it doesn't depend on whether --root-url applies to --merge.
      - name: Put the bottle in the formula, served from a file:// root
        run: |
          serve="$PWD/serve"
          mkdir -p "$serve"
          ruby -rjson -rfileutils -e '
            dir, serve = ARGV
            Dir[File.join(dir, "*.bottle.json")].each do |path|
              json = JSON.parse(File.read(path))
              json.each_value do |formula|
                formula["bottle"]["root_url"] = "file://#{serve}"
                formula["bottle"]["tags"].each_value do |tag|
                  FileUtils.cp(File.join(dir, tag["local_filename"]), File.join(serve, tag["filename"]))
                end
              end
              File.write(path, JSON.generate(json))
            end
          ' "$PWD/bottles" "$serve"
          ls -l "$serve"
          # Homebrew 7 trusts a formula you install by name, but `brew bottle` refuses to load one
          # from an untrusted tap. Trust this one formula, not the whole tap.
          brew trust --formula redtear1115/tap/marsdawn
          # Relative names, as `brew pr-pull` passes them, so nothing here looks like a tap path.
          (cd bottles && brew bottle --merge --write --no-commit ./*.bottle.json)
          sed -n '/bottle do/,/^  end/p' "$(brew --repository redtear1115/tap)/Formula/marsdawn.rb"

      # Now install by name, the way a user does. On macos-26 this is the measurement that brew
      # *chooses* the arm64_sequoia bottle on a newer macOS, not only that the binary runs there.
      - name: Install from the tap, as a user would
        run: brew install --verbose redtear1115/tap/marsdawn 2>&1 | tee install.log

      - name: It poured, and nothing was built
        run: .github/scripts/assert-poured.sh install.log

      - name: It reports the version it was released as
        run: |
          expected="$(brew info --json=v2 redtear1115/tap/marsdawn | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["versions"]["stable"]')"
          actual="$(marsdawn --version)"
          echo "formula: $expected  marsdawn --version: $actual"
          [ "$actual" = "$expected" ]

      - run: brew test --verbose redtear1115/tap/marsdawn

      - name: Export a real document and read its text back
        run: .github/scripts/export-check.sh

  refuses-without-xcode-26:
    # The other half of pour-check. If brew quietly built with Xcode 16.4 when no bottle applied,
    # "it installed" on macos-15 would prove nothing. So give it no bottle, and assert it refuses —
    # with Xcode in the reason — rather than falls back.
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: This runner must not be able to build the formula
        run: .github/scripts/assert-xcode-not-26.sh

      - name: Tap this checkout
        run: |
          git switch -c refuses-check
          brew tap redtear1115/tap "$GITHUB_WORKSPACE"

      - name: A source build is refused, not attempted with the wrong Xcode
        run: |
          status=0
          brew install --build-from-source redtear1115/tap/marsdawn > refuse.log 2>&1 || status=$?
          cat refuse.log
          if [ "$status" -eq 0 ]; then
            echo "It installed without Xcode 26 selected, so the pour check proves nothing." >&2
            exit 1
          fi
          if ! grep -qi 'xcode' refuse.log; then
            echo "It failed, but not for lack of Xcode 26; the refusal isn't the one we rely on." >&2
            exit 1
          fi
          if command -v marsdawn >/dev/null; then
            echo "It failed, yet a marsdawn is installed; something built it anyway." >&2
            exit 1
          fi
          echo "Refused, for Xcode, with exit status $status and nothing installed."
